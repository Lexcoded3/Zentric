<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Zentric Energy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Host Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: rgb(17, 17, 17);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  .code {
    font-size: clamp(72px, 18vw, 140px);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    color: rgb(226, 250, 90);
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 16px 0 12px;
  }
  p {
    font-size: 16px;
    line-height: 1.5;
    color: #cccccc;
    margin-bottom: 28px;
    word-break: break-word;
  }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: rgb(226, 250, 90);
    color: rgb(17, 17, 17);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: opacity .2s ease;
  }
  .btn:hover { opacity: .85; }
  .hint { margin-top: 18px; font-size: 13px; color: #888888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p id="reason">The page you're looking for was moved, removed, or never existed.</p>
  <a class="btn" href="./">Back to home</a>
  <div class="hint">Zentric Energy — Smart Solar Solutions for Homes</div>
</div>
<script>
// GitHub Pages clean-URL shim: "/Zentric/contact" -> "/Zentric/contact.html".
// GitHub Pages serves 404.html for unknown paths; if the requested path maps
// to a known page file, redirect there instead of showing this page.
(function () {
  var known = ['contact', 'index'];
  var path = location.pathname.split('/').pop() || '';
  if (!path && location.pathname.slice(-1) !== '/') return; // root file, real 404
  if (known.indexOf(path) !== -1) {
    location.replace(location.pathname.replace(/[^/]*$/, path + '.html') + location.search + location.hash);
    return;
  }
  // strip a trailing slash for display
  var shown = location.pathname.replace(/\/+$/, '');
  if (shown) document.getElementById('reason').textContent =
    'Nothing is hosted at ' + shown + '.';
})();
</script>
</body>
</html>
